name: TicketIn Full CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 0. DETECT CHANGED COMPONENTS (Smart Selective CI)
  # ============================================================================
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - 'supabase/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - 'build-apk.sh'
              - 'scripts/**'
              - '.github/workflows/ci.yml'

  # ============================================================================
  # 1. WEB CI & VERCEL DEPLOY PIPELINE (Lint, Typecheck, Build, Auto-Deploy)
  # ============================================================================
  web-ci:
    name: Web Quality & Vercel Deploy
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Build Next.js Web App
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://localhost:8000' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'dummy_anon_key' }}

      - name: Deploy to Vercel (Production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./web

      - name: Deploy to Vercel (Preview for PR)
        if: github.event_name == 'pull_request' && env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./web
          github-comment: true

      - name: Vercel Secret Setup Guide
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "::notice title=Vercel Auto-Deploy::VERCEL_TOKEN is not configured in GitHub Secrets yet. Once VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID are added, pushes to 'main' will automatically deploy to production."

  # ============================================================================
  # 2. MOBILE CI & APK BUILD PIPELINE (Flutter Analyze, Test, Build APK)
  # ============================================================================
  mobile-ci:
    name: Mobile Quality & APK Build
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.mobile == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    env:
      TICKETIN_APPLICATION_ID: com.mhhanif.ticketin
      API_BASE_URL: https://ticket-in-nine.vercel.app/api
      TICKETIN_SIGNING_STORE_FILE: ci-release.jks
      TICKETIN_SIGNING_STORE_PASSWORD: ci-only-release-password
      TICKETIN_SIGNING_KEY_ALIAS: ticketinRelease
      TICKETIN_SIGNING_KEY_PASSWORD: ci-only-release-password

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code
        run: flutter analyze --no-fatal-infos lib/

      - name: Run Flutter Tests
        run: flutter test --no-pub || true

      - name: Configure CI Release Signing
        run: |
          keytool -genkeypair \
            -v \
            -keystore "android/${TICKETIN_SIGNING_STORE_FILE}" \
            -storetype JKS \
            -storepass "${TICKETIN_SIGNING_STORE_PASSWORD}" \
            -keypass "${TICKETIN_SIGNING_KEY_PASSWORD}" \
            -alias "${TICKETIN_SIGNING_KEY_ALIAS}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=TicketIn CI"

      - name: Build Debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=${API_BASE_URL} --dart-define=TICKETIN_APPLICATION_ID=${TICKETIN_APPLICATION_ID}

      - name: Build Release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${API_BASE_URL} --dart-define=TICKETIN_APPLICATION_ID=${TICKETIN_APPLICATION_ID}

      - name: Prepare Artifacts
        run: |
          mkdir -p ../apk-output
          cp build/app/outputs/flutter-apk/app-debug.apk ../apk-output/TicketIn-debug.apk
          cp build/app/outputs/flutter-apk/app-release.apk ../apk-output/TicketIn-release.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TicketIn-debug-apk
          path: apk-output/TicketIn-debug.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TicketIn-release-apk
          path: apk-output/TicketIn-release.apk
          retention-days: 30

      - name: Generate Mobile 1-Command Install Guide in Step Summary
        run: |
          echo "## 📱 Mobile APK Successfully Built!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📲 1-Command Install ke HP (via ADB USB / Wi-Fi):" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# Download & install rilis terbaru ke HP secara otomatis:" >> $GITHUB_STEP_SUMMARY
          echo "make install-mobile-ci" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Atau jalankan skrip installer langsung:" >> $GITHUB_STEP_SUMMARY
          echo "./scripts/install-mobile.sh --remote" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts Tersedia:" >> $GITHUB_STEP_SUMMARY
          echo "- **TicketIn-release-apk** (Optimized & Signed Release)" >> $GITHUB_STEP_SUMMARY
          echo "- **TicketIn-debug-apk** (Debug build)" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # 3. GITHUB RELEASE AUTOMATION (Triggered on git tag 'v*')
  # ============================================================================
  create-release:
    name: Create GitHub Release with APK
    needs: mobile-ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Release APK
        uses: actions/download-artifact@v4
        with:
          name: TicketIn-release-apk
          path: release-artifacts

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/TicketIn-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
