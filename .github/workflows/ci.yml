name: CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Environment
        # Kita jalankan container web-app di background (detached)
        run: docker compose up -d web-app

      - name: Install Dependencies
        # Menjalankan npm install di dalam container Next.js
        run: docker compose exec -T web-app npm install

      - name: Run ESLint
        # Menjalankan linter di dalam container sesuai permintaan S1-T5
        run: docker compose exec -T web-app npm run lint

      # Placeholder untuk Vitest (jika nanti ditambahkan di sprint selanjutnya)
      # - name: Run Tests
      #   run: docker compose exec -T web-app npm run test

      - name: Teardown Environment
        if: always()
        run: docker compose down
