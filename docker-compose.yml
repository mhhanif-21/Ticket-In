services:
  db-migrate:
    image: postgres:16-alpine
    container_name: ticketin-db-migrate
    volumes:
      - ./web/supabase/migrations:/migrations:ro
    environment:
      # The external Supabase database is reachable through this Compose network.
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
    command:
      - /bin/sh
      - -ec
      - |
        until pg_isready --dbname="$$DATABASE_URL"; do sleep 2; done
        psql --dbname="$$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=/migrations/0007_batch4_lifecycle-export-labels.sql
        psql --dbname="$$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=/migrations/0008_s9_event-media-idempotency.sql
        psql --dbname="$$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=/migrations/0009_s9_ticket-templates.sql
        psql --dbname="$$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=/migrations/0010_s9_registration-file-lifecycle.sql
        psql --dbname="$$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=/migrations/0011_web-security-perimeter.sql
        psql --dbname="$$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=/migrations/0012_registration-event-lifecycle-integrity.sql
        psql --dbname="$$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=/migrations/0013_storage-media-export-durability.sql
        psql --dbname="$$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=/migrations/0014_manual-review-email-template-kinds.sql
        test "$$(psql --dbname="$$DATABASE_URL" --tuples-only --no-align --command="SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'events' AND column_name = 'status'")" = "1"
        test "$$(psql --dbname="$$DATABASE_URL" --tuples-only --no-align --command="SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'events' AND column_name IN ('creation_key', 'volunteer_session_version', 'form_version')")" = "3"
        test "$$(psql --dbname="$$DATABASE_URL" --tuples-only --no-align --command="SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'event_media' AND column_name = 'public_url'")" = "1"
        test "$$(psql --dbname="$$DATABASE_URL" --tuples-only --no-align --command="SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'event_ticket_templates' AND column_name = 'elements'")" = "1"
        test "$$(psql --dbname="$$DATABASE_URL" --tuples-only --no-align --command="SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'participant_file_uploads' AND column_name = 'status'")" = "1"
        test "$$(psql --dbname="$$DATABASE_URL" --tuples-only --no-align --command="SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'registration_status_capabilities' AND column_name = 'token_hash'")" = "1"
        test "$$(psql --dbname="$$DATABASE_URL" --tuples-only --no-align --command="SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'form_fields' AND column_name = 'field_key'")" = "1"
        test "$$(psql --dbname="$$DATABASE_URL" --tuples-only --no-align --command="SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'storage_cleanup_jobs' AND column_name = 'storage_path'")" = "1"
        test "$$(psql --dbname="$$DATABASE_URL" --tuples-only --no-align --command="SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'export_jobs' AND column_name = 'storage_path'")" = "1"
        test "$$(psql --dbname="$$DATABASE_URL" --tuples-only --no-align --command="SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'event_approval_email_templates' AND column_name = 'template_kind'")" = "1"
    networks:
      - TiketIn-network
      - supabase-local

  web-app:
    image: node:20-alpine
    container_name: ticketin-web-app
    working_dir: /app
    env_file:
      - ./web/.env.local
    volumes:
      - ./web:/app
      - ./docs:/workspace/docs:ro
      - web-node-modules:/app/node_modules
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      - NODE_ENV=development
      # Database URL mengarah ke Supabase lokal via network bridge
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
      - NEXT_PUBLIC_SUPABASE_URL=http://kong:8000
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-Event Gate}
      - QSTASH_TOKEN=${QSTASH_TOKEN:-}
      - QSTASH_URL=${QSTASH_URL:-}
      - QSTASH_CURRENT_SIGNING_KEY=${QSTASH_CURRENT_SIGNING_KEY:-}
      - QSTASH_NEXT_SIGNING_KEY=${QSTASH_NEXT_SIGNING_KEY:-}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL:-}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - TRUSTED_PROXY_SHARED_SECRET=${TRUSTED_PROXY_SHARED_SECRET:-}
      - TRUSTED_CLIENT_IP_HEADER=${TRUSTED_CLIENT_IP_HEADER:-x-ticketin-client-ip}
      - REGISTRATION_RESUBMIT_SECRET=${REGISTRATION_RESUBMIT_SECRET:-}
      # Leave canonical URL empty when it is not configured so production
      # startup cannot silently downgrade to localhost.
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-}
      - APP_URL=${APP_URL:-}
      - CANONICAL_APP_URL=${CANONICAL_APP_URL:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
    networks:
      - TiketIn-network
      - supabase-local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --webpack"

  edge-proxy:
    image: nginx:1.27-alpine
    container_name: ticketin-edge-proxy
    depends_on:
      web-app:
        condition: service_healthy
    environment:
      - TRUSTED_PROXY_SHARED_SECRET=${TRUSTED_PROXY_SHARED_SECRET:-}
      - EDGE_PROXY_ASSERTION=${TRUSTED_PROXY_SHARED_SECRET:-unconfigured-proxy-assertion}
    ports:
      - "3000:80"
    volumes:
      - ./infra/edge-proxy/nginx.conf.template:/etc/nginx/templates/ticketin.conf.template:ro
    command: >-
      /bin/sh -c "envsubst '$$EDGE_PROXY_ASSERTION' <
      /etc/nginx/templates/ticketin.conf.template >
      /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    networks:
      - TiketIn-network

  mobile-admin-build:
    image: ghcr.io/cirruslabs/flutter@sha256:217a3d81b124f3fab82b24633bf66b256cc74528b894e7f17103f70150232077
    container_name: ticketin-mobile-admin-build
    volumes:
      - ./mobile:/workspace
      - flutter-build-output:/workspace/build
      - flutter-project-gradle:/workspace/android/.gradle
      - flutter-pub-cache:/root/.pub-cache
      - flutter-gradle-cache:/root/.gradle
      - flutter-android-ndk:/opt/android-sdk-linux/ndk
      - flutter-android-platforms:/opt/android-sdk-linux/platforms
    working_dir: /workspace
    environment:
      - TICKETIN_APPLICATION_ID=${TICKETIN_APPLICATION_ID:-}
    command: tail -f /dev/null
    networks:
      - TiketIn-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  TiketIn-network:
    driver: bridge
  supabase-local:
    external: true
    name: supabase_network_event_gate

volumes:
  web-node-modules:
  flutter-build-output:
  flutter-project-gradle:
  flutter-pub-cache:
  flutter-gradle-cache:
  flutter-android-ndk:
  flutter-android-platforms:
