services:
  web-app:
    image: node:20-alpine
    container_name: ticketin-web-app
    working_dir: /app
    volumes:
      - ./web:/app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # Database URL mengarah ke Supabase lokal via network bridge
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:15432/postgres
      - NEXT_PUBLIC_SUPABASE_URL=http://host.docker.internal:15431
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - QSTASH_TOKEN=${QSTASH_TOKEN:-}
      - QSTASH_URL=${QSTASH_URL:-}
    networks:
      - TiketIn-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npm install && npm run dev"

  mobile-admin-build:
    image: ghcr.io/cirruslabs/flutter:latest
    container_name: ticketin-mobile-admin-build
    volumes:
      - ./mobile:/workspace
    working_dir: /workspace
    command: tail -f /dev/null
    networks:
      - TiketIn-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  TiketIn-network:
    driver: bridge
