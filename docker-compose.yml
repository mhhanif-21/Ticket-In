services:
  # Node.js backend container configuration will be added here in the future.

  mobile-admin-build:
    image: ghcr.io/cirruslabs/flutter:latest
    container_name: ticketin-mobile-admin-build
    volumes:
      - ./mobile:/workspace
    working_dir: /workspace
    command: tail -f /dev/null
    networks:
      - TiketIn-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  TiketIn-network:
    driver: bridge
